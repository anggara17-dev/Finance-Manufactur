<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>FinKuvek — Finance Manufaktur Konveksi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e7e9ee; --line2:#f0f2f5;
  --tx:#0f172a; --tx2:#64748b;
  --ac:#4f46e5; --ac2:#eef2ff; --ac3:#c7d2fe;
  --ok:#059669; --ok2:#ecfdf5; --warn:#b45309; --warn2:#fffbeb;
  --bad:#dc2626; --bad2:#fef2f2; --r:14px;
  --sh:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.up{color:var(--ok)} .down{color:var(--bad)} .mut{color:var(--tx2);font-size:13px}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:50;transition:transform .25s ease}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.brand-text b{display:block;font-size:15px;letter-spacing:-.2px}
.brand-text span{font-size:11px;color:var(--tx2)}
nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#3f4a5c;cursor:pointer;font-weight:500;margin-bottom:2px;min-height:44px;border:none;background:none;width:100%;font-size:13.5px;text-align:left}
.nav-item svg{width:18px;height:18px;flex:none;fill:currentColor;opacity:.75}
.nav-item:hover{background:var(--line2)}
.nav-item.active{background:var(--ac2);color:var(--ac)}
.sidebar-foot{padding:14px 16px;font-size:11px;color:var(--tx2);border-top:1px solid var(--line2)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:40;display:none}
.overlay.show{display:block}

/* ---------- Main ---------- */
.main{margin-left:250px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,247,249,.86);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
.topbar p{font-size:12px;color:var(--tx2)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:none;place-items:center;cursor:pointer;font-size:17px;flex:none}
.content{padding:20px 22px 48px;max-width:1280px;width:100%}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(15,23,42,.15)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .icon-btn{display:grid}
  .content{padding:16px 14px 48px}
  .topbar{padding:11px 14px}
}

/* ---------- Card & table ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-head b{font-size:14px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;padding:10px 14px;background:#fafbfc;color:var(--tx2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbff}
.mini-table{min-width:0;font-size:12.5px}
.mini-table th,.mini-table td{padding:8px 10px}
.r{text-align:right} .c{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--tx2)}
.bold{font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--tx2);font-size:13px}
tfoot td{border-top:1px solid var(--line);border-bottom:none;background:#fafbfc}

/* ---------- Button ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--ac);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;min-height:40px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--line)}
.btn.soft{background:var(--ac2);color:var(--ac)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:12px;border-radius:8px}
.danger-t{color:var(--bad)!important}
.act{display:flex;gap:6px;justify-content:flex-end}

/* ---------- Badge & chip ---------- */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.b-green{background:var(--ok2);color:var(--ok)}
.b-amber{background:var(--warn2);color:var(--warn)}
.b-red{background:var(--bad2);color:var(--bad)}
.b-gray{background:#f1f5f9;color:#475569}
.b-indigo{background:var(--ac2);color:var(--ac)}
.chip{background:var(--ac2);color:var(--ac);font-weight:600;font-size:12px;padding:7px 12px;border-radius:99px;white-space:nowrap}

/* ---------- Stat ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stat span{font-size:12px;color:var(--tx2);display:block;margin-bottom:6px}
.stat b{font-size:19px;font-weight:700;letter-spacing:-.3px}
.stat small{display:block;font-size:11px;color:var(--tx2);margin-top:5px}
.stat.hi{border-color:var(--ac3);background:linear-gradient(180deg,#fbfbff,#f3f4ff)}

/* ---------- Grid ---------- */
.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2c{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--tx2)}

/* ---------- Chart ---------- */
.chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0;height:100%}
.chart .bar{width:100%;max-width:26px;background:linear-gradient(180deg,#6366f1,#4f46e5);border-radius:6px 6px 3px 3px;min-height:3px}
.chart .lbl{font-size:9.5px;color:var(--tx2)}

/* ---------- Form & modal ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:#fff;min-height:44px;color:var(--tx)}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
@media(pointer:coarse){.field input,.field select,.field textarea,.tin{font-size:16px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-backdrop.show{display:flex}
.modal{background:#fff;width:100%;max-width:580px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:20px;animation:up .22s ease}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:16px;animation:pop .16s ease}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal h3{font-size:16px;margin-bottom:12px}
.modal h4{font-size:13px;margin:16px 0 8px}

/* ---------- Search & inputs dalam tabel ---------- */
.search{position:relative;flex:1;max-width:280px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;font-size:13px;font-family:inherit;min-height:40px}
.search input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:none;stroke:var(--tx2);stroke-width:2;stroke-linecap:round}
.tin{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff;min-height:38px;color:var(--tx)}
.tin:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.tin.r{text-align:right}
select.tin{padding-right:6px}

/* ---------- Preview ---------- */
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#f8fafc;border:1px solid var(--line2);border-radius:12px;padding:12px;margin-top:4px}
.preview span{display:block;font-size:10.5px;color:var(--tx2)}
.preview b{font-size:12.5px}
.margin-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--ac2);border:1px solid var(--ac3);border-radius:12px;padding:12px;margin-top:14px}
.margin-box span{display:block;font-size:10.5px;color:var(--tx2)}
.margin-box b{font-size:13px}

/* ---------- Invoice paper ---------- */
.inv{background:#fff;color:#111;font-size:12.5px}
.inv table{min-width:0}
.inv-table th{background:#f4f5f7;color:#333;font-size:10px}
.inv-table td{padding:9px 10px;border-bottom:1px solid #eef0f3}
.inv-head{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:3px solid var(--ac);margin-bottom:16px}
@media(max-width:520px){.inv-head{flex-direction:column}}
.inv-totals{margin-left:auto;max-width:320px;margin-top:14px}
.inv-totals .kv{padding:6px 0;font-size:12.5px}
.inv-totals .grand{border-top:2px solid #0f172a;font-size:14px;padding-top:8px;margin-top:4px}
.inv-totals .grand b{font-weight:800}
.inv-pay{margin-top:16px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
.inv-note{margin-top:10px;font-size:12px}
.inv-foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);text-align:center;color:var(--tx2);font-size:11px}

/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body.print-mode>*:not(#printArea){display:none!important}
  body.print-mode{background:#fff}
  body.print-mode #printArea{display:block!important}
  .inv{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#0f172a;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;animation:up .2s;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:100%}
.toast.err{background:var(--bad)}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-logo">FK</div>
    <div class="brand-text"><b>FinKuvek</b><span>Finance Manufaktur Konveksi</span></div>
  </div>
  <nav id="nav"></nav>
  <div class="sidebar-foot">v1.1 · Supabase + Vercel</div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="Menu">☰</button>
    <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub"></p></div>
  </header>
  <div class="content" id="content"></div>
</main>

<div class="modal-backdrop" id="modalBack"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="printArea"></div>

<script>
/* ================= HELPER ================= */
const $ = s => document.querySelector(s);
const rp  = n => 'Rp ' + Math.round(Number(n || 0)).toLocaleString('id-ID');
const rp2 = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf  = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const pct = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fdate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';

async function api(func, { method = 'GET', params = {}, body } = {}) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`/api/${func}${qs ? '?' + qs : ''}`, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {}; try { j = await res.json(); } catch {}
  if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
  return j;
}
function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'err' ? ' err' : '');
  t.textContent = msg;
  $('#toastWrap').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, 2600);
}
function openModal(html) { $('#modalBox').innerHTML = html; $('#modalBack').classList.add('show'); }
function closeModal() { $('#modalBack').classList.remove('show'); $('#modalBox').innerHTML = ''; }
function stBadge(s) { const c = s === 'Selesai' ? 'b-green' : s === 'Produksi' ? 'b-amber' : 'b-gray'; return `<span class="badge ${c}">${esc(s)}</span>`; }
function payBadge(s) { return `<span class="badge ${s === 'Lunas' ? 'b-green' : s === 'DP' ? 'b-amber' : 'b-red'}">${esc(s)}</span>`; }
function mBadge(m) { const v = Number(m || 0); return `<span class="badge ${v >= 0 ? 'b-green' : 'b-red'}">${v >= 0 ? '+' : ''}${pct(v)}</span>`; }
function setPage(t, s = '') { $('#pageTitle').textContent = t; $('#pageSub').textContent = s; closeSidebar(); window.scrollTo(0, 0); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
function printHTML(html) {
  const pa = document.getElementById('printArea');
  pa.innerHTML = html;
  const done = () => { document.body.classList.remove('print-mode'); pa.innerHTML = ''; };
  window.addEventListener('afterprint', done, { once: true });
  document.body.classList.add('print-mode');
  setTimeout(() => { window.print(); setTimeout(done, 600); }, 60);
}

/* ================= IKON & NAV ================= */
const IC = {
  dashboard:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>',
  produk:'<path d="M12.9 2.6a2 2 0 0 0-1.5-.6H5a2 2 0 0 0-2 2v6.4c0 .5.2 1 .6 1.4l8.5 8.5a2 2 0 0 0 2.9 0l6.9-6.9a2 2 0 0 0 0-2.9L12.9 2.6Z"/><circle cx="8.2" cy="8.2" r="1.7" fill="#fff"/>',
  bahan:'<path d="m12 2 10 5.5-10 5.5L2 7.5 12 2Z"/><path d="M3.5 11 2 11.9l10 5.6 10-5.6-1.5-.9-8.5 4.8L3.5 11Z"/><path d="M3.5 15.6 2 16.5 12 22l10-5.5-1.5-.9-8.5 4.8-8.5-4.8Z"/>',
  supplier:'<path d="M1 5.5A1.5 1.5 0 0 1 2.5 4H13a1 1 0 0 1 1 1v9H3.5A2.5 2.5 0 0 1 1 11.5v-6Z"/><path d="M14 8h3.4a1 1 0 0 1 .8.4l2.4 3.1c.26.35.4.78.4 1.2v1.4a1.9 1.9 0 0 1-1.9 1.9H14V8Z"/><circle cx="6.3" cy="17.8" r="2.1"/><circle cx="16.8" cy="17.8" r="2.1"/>',
  tenagakerja:'<circle cx="12" cy="7.2" r="4.2"/><path d="M3.8 20.5c.4-3.9 4-6.3 8.2-6.3s7.8 2.4 8.2 6.3l.1.9H3.7l.1-.9Z"/>',
  bom:'<path d="M9 2.5h6a1 1 0 0 1 1 1V4h1.5A2.5 2.5 0 0 1 20 6.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 19.5v-13A2.5 2.5 0 0 1 6.5 4H8v-.5a1 1 0 0 1 1-1Z"/><rect x="8" y="10.5" width="8" height="1.8" rx=".9" fill="#fff"/><rect x="8" y="14.5" width="5.5" height="1.8" rx=".9" fill="#fff"/>',
  po:'<path d="M2.5 20.5V9.2l5.5 3.4V9.2l5.5 3.4V4.5a1 1 0 0 1 1-1h6.5a1 1 0 0 1 1 1v16H2.5Z"/><rect x="14.5" y="13.5" width="3.2" height="3.2" rx=".6" fill="#fff"/>',
  pembelian:'<path d="M2 7a1.5 1.5 0 0 1 1.5-1.5h8.6a1 1 0 0 1 1 1V15H4a2 2 0 0 1-2-2V7Z"/><path d="M13.1 8.2h3.1c.3 0 .58.13.77.36l2.7 3.2c.28.33.43.74.43 1.17v1.77A1.5 1.5 0 0 1 18.6 16H13.1V8.2Z"/><circle cx="6.6" cy="18.3" r="2"/><circle cx="16.6" cy="18.3" r="2"/>',
  overhead:'<path d="M3.5 21h17v-1.8h-17V21Z"/><path d="M5.5 17.4h2.2v-7.5H5.5v7.5Zm4 0h2.2v-10H9.5v10Zm4 0h2.2v-7.5h-2.2v7.5Zm4 0h2.2v-10h-2.2v10Z"/><path d="M3 6.8 12 3l9 3.8v1.4H3V6.8Z"/>',
  hpp:'<circle cx="12" cy="12" r="9.2"/><path d="M12 5.8v12.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M15.2 9.3c-.4-1.1-1.6-1.7-3.1-1.7-1.8 0-3 .9-3 2.2 0 3 6.2 1.6 6.2 4.6 0 1.4-1.3 2.3-3.2 2.3-1.7 0-2.9-.7-3.4-1.9" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/>',
  penjualan:'<path d="M2.3 3h2.8a1 1 0 0 1 1 .76L6.7 6h14a.8.8 0 0 1 .77 1l-1.9 7a2 2 0 0 1-1.93 1.5H9.2a2 2 0 0 1-1.95-1.54L4.6 4.8l-.3-1.1a.4.4 0 0 0-.4-.3H2.3a.7.7 0 1 1 0-1.4Z"/><circle cx="9.7" cy="19.3" r="1.7"/><circle cx="16.7" cy="19.3" r="1.7"/>',
  invoice:'<path d="M5 2h14a1 1 0 0 1 1 1v18.5l-3-1.8-2.5 1.8-2.5-1.8-2.5 1.8-2.5-1.8-3 1.8V3a1 1 0 0 1 1-1Z"/><rect x="7.5" y="6.8" width="9" height="1.7" rx=".85" fill="#fff"/><rect x="7.5" y="10.5" width="9" height="1.7" rx=".85" fill="#fff"/><rect x="7.5" y="14.2" width="5.4" height="1.7" rx=".85" fill="#fff"/>',
  pengaturan:'<path d="M4 7.2h9.2M17.6 7.2H20M4 16.8h4.4M12.8 16.8H20" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="15.3" cy="7.2" r="2.5"/><circle cx="10.7" cy="16.8" r="2.5"/>',
};
const NAV = [
  { id:'dashboard',  l:'Dashboard',          ic:'dashboard' },
  { id:'produk',     l:'Master Produk',      ic:'produk' },
  { id:'bahan',      l:'Master Bahan',       ic:'bahan' },
  { id:'supplier',   l:'Master Supplier',    ic:'supplier' },
  { id:'tenagakerja',l:'Tenaga Kerja',       ic:'tenagakerja' },
  { id:'bom',        l:'BOM / Resep',        ic:'bom' },
  { id:'po',         l:'Production Order',   ic:'po' },
  { id:'pembelian',  l:'Pembelian Bahan',    ic:'pembelian' },

async function loadMasterRows(key) {

        if (c.badge) return `<td><span class="badge ${c.badge}">${esc(r[c.k] || '-')}</span></td>`;
        return `<td class="${c.bold ? 'bold' : ''} ${c.mono ? 'mono' : ''}">${esc(r[c.k] ?? '-')}</td>`;

function fieldHTML(f, val) {
  const id = 'f_' + f.k, v = val ?? f.def ?? '';
  let inp;
  if (f.type === 'select')
    inp = `<select id="${id}">${f.opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea')
    inp = `<textarea id="${id}" rows="3" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else
    inp = `<input id="${id}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.req ? 'required' : ''} ${f.type === 'number' ? 'min="0" step="any" inputmode="decimal"' : ''}>`;
  return `<div class="field"><label>${esc(f.l)}${f.req ? ' *' : ''}</label>${inp}</div>`;
}

function bahanOptions(list, sel) {

    </div>`;

  $('#bomSave').onclick = saveBom;
}
async function loadBom(pid) {
  BPID = pid || null; BROWS = [];
  if (!pid) { renderBomRows(); return; }
  const bom = await api('bom', { params: { produk_id: pid } });
  BROWS = (bom?.bom_detail || []).map(d => ({ bahan_id: d.bahan_id, qty_standar: d.qty_standar, waste_pct: d.waste_pct }));
  renderBomRows();
}
function renderBomRows() {
  const tb = $('#btb'); if (!tb) return;
  if (!BROWS.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">Belum ada baris. Klik “+ Baris”.</td></tr>'; bomTotal(); return; }
  tb.innerHTML = BROWS.map((r, i) => {
    const b = BL.find(x => x.id === Number(r.bahan_id));
    const ef = (Number(r.qty_standar) || 0) * (1 + (Number(r.waste_pct) || 0) / 100);
    return `<tr>
      <td><select class="tin" style="min-width:200px" onchange="bomSet(${i},'bahan_id',this.value)"><option value="">— Pilih —</option>${bahanOptions(BL, r.bahan_id)}</select></td>
      <td class="r"><input class="tin r" type="number" step="any" min="0" style="width:90px" value="${r.qty_standar}" oninput="bomSet(${i},'qty_standar',this.value)"></td>
      <td class="r"><input class="tin r" type="number" step="any" min="0" style="width:70px" value="${r.waste_pct}" oninput="bomSet(${i},'waste_pct',this.value)"></td>
      <td class="r bold" id="ef_${i}">${nf(ef)} <small class="mono">${esc(b?.satuan || '')}</small></td>
      <td class="r mono" id="hg_${i}">${rp(b?.harga || 0)}</td>
      <td class="r bold" id="by_${i}">${rp(ef * (b?.harga || 0))}</td>
      <td class="r"><button class="btn ghost sm danger-t" onclick="bomDel(${i})">✕</button></td>
    </tr>`;
  }).join('');
  bomTotal();
}
function bomSet(i, k, v) {
  const r = BROWS[i];
  if (k === 'bahan_id') r.bahan_id = Number(v) || 0; else r[k] = parseFloat(v) || 0;
  const b = BL.find(x => x.id === Number(r.bahan_id));
  const ef = (Number(r.qty_standar) || 0) * (1 + (Number(r.waste_pct) || 0) / 100);
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('ef_' + i, nf(ef) + ' <small class="mono">' + esc(b?.satuan || '') + '</small>');
  if (k === 'bahan_id') set('hg_' + i, rp(b?.harga || 0));
  set('by_' + i, rp(ef * (b?.harga || 0)));
  bomTotal();
}
function bomTotal() {
  const el = $('#bomTotal'); if (!el) return;
  let t = 0;
  BROWS.forEach(r => {
    const b = BL.find(x => x.id === Number(r.bahan_id));
    t += (Number(r.qty_standar) || 0) * (1 + (Number(r.waste_pct) || 0) / 100) * (b?.harga || 0);
  });
  el.textContent = 'Direct Material / pcs: ' + rp(t);
}
function bomDel(i) { BROWS.splice(i, 1); renderBomRows(); }
async function saveBom() {
  if (!BPID) return toast('Pilih produk dulu', 'err');
  const items = BROWS.filter(r => Number(r.bahan_id) > 0 && Number(r.qty_standar) > 0);
  if (!items.length) return toast('Minimal 1 baris bahan valid', 'err');
  try {
    await api('bom', { method: 'POST', body: { produk_id: Number(BPID), items } });
    toast('BOM tersimpan ✓');
  } catch (e) { toast(e.message, 'err'); }
}

        <tbody>${PD.mat.map((m, i) => matRow(m, i)).join('')}</tbody>
        <tfoot><tr><td colspan="6" class="r bold">Total Material</td><td class="r bold" id="matTot">${rp(PD.mat.reduce((s, m) => s + m.qty_aktual_in * m.harga, 0))}</td></tr></tfoot>
      </table></div>
    </div>
    <div class="card">
      <div class="card-head"><b>2 · Tenaga Kerja Langsung</b>

        <tbody id="labTb">${PD.lab.length ? PD.lab.map((l, i) => labRow(l, i)).join('') : '<tr><td colspan="7" class="empty">Belum ada baris. Klik “+ Baris TK”.</td></tr>'}</tbody>
        <tfoot><tr><td colspan="5" class="r bold">Total Direct Labor</td><td class="r bold" id="labTot">${rp(PD.lab.reduce((s, l) => s + labBiaya(l), 0))}</td><td></td></tr></tfoot>
      </table></div>

      <div class="card">
        <div class="card-head"><b>3 · Alokasi Factory Overhead</b></div>

          <div class="kv"><span>Total FOH periode ${d.overhead.periode}</span><b>${rp(d.overhead.total_overhead_bulan)}</b></div>
          <div class="kv"><span>Basis alokasi (qty produksi selesai bulan itu)</span><b>${nf(d.overhead.basis_qty_bulan)} pcs</b></div>
          <div class="kv"><span>Rate / pcs</span><b>${rp2(d.overhead.per_pcs)}</b></div>
          <div class="kv"><span>Dialokasikan ke PO ini (${nf(d.po.qty)} pcs)</span><b>${rp(d.overhead.dialokasikan)}</b></div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><b>4 · HPP & Estimasi Margin</b></div>
        <div style="padding:14px 16px">
          <div class="kv"><span>HPP / pcs</span><b>${rp2(r.hpp_per_pcs)}</b></div>
          <div class="kv"><span>Harga jual</span><b>${rp(d.po.harga_jual)}</b></div>
          <div class="kv"><span>Est. profit / pcs</span><b class="${r.margin_rp >= 0 ? 'up' : 'down'}">${rp(r.margin_rp)}</b></div>
          <div class="kv"><span>Est. margin</span>${mBadge(r.margin_pct)}</div>
          ${d.po.status !== 'Selesai' ? `<button class="btn" style="margin-top:14px" onclick="poStatus(${d.po.id},'${d.po.status}')">${d.po.status === 'Draft' ? '▶ Mulai Produksi' : '✓ Tandai Selesai'}</button>` : ''}
        </div>
      </div>
    </div>`;
}
function matRow(m, i) {
  const sel = m.qty_aktual_in - m.qty_std_total;
  return `<tr>
    <td><b>${esc(m.nama)}</b><br><small class="mono">${esc(m.kode)}</small></td>
    <td class="r">${nf(m.qty_std_pcs)} <small class="mono">${esc(m.satuan)}</small></td>
    <td class="r">${nf(m.qty_std_total)}</td>
    <td class="r"><input class="tin r" type="number" step="any" min="0" style="width:100px" value="${m.qty_aktual_in}" oninput="matSet(${i},this.value)"></td>
    <td class="r" id="sd_${i}"><span class="${Math.abs(sel) < 0.0001 ? '' : sel > 0 ? 'down' : 'up'}">${sel > 0 ? '+' : ''}${nf(sel)}</span></td>
    <td class="r mono">${rp(m.harga)}</td>
    <td class="r bold" id="ma_${i}">${rp(m.qty_aktual_in * m.harga)}</td></tr>`;
}
function matSet(i, v) {
  PD.mat[i].qty_aktual_in = parseFloat(v) || 0;
  const m = PD.mat[i], sel = m.qty_aktual_in - m.qty_std_total;
  document.getElementById('sd_' + i).innerHTML = `<span class="${Math.abs(sel) < 0.0001 ? '' : sel > 0 ? 'down' : 'up'}">${sel > 0 ? '+' : ''}${nf(sel)}</span>`;
  document.getElementById('ma_' + i).textContent = rp(m.qty_aktual_in * m.harga);
  document.getElementById('matTot').textContent = rp(PD.mat.reduce((s, m2) => s + m2.qty_aktual_in * m2.harga, 0));
}
async function saveMat() {
  try {
    await api('po-material', { method: 'POST', params: { po_id: PD.id },
      body: { items: PD.mat.filter(m => m.bahan_id).map(m => ({ bahan_id: m.bahan_id, qty_aktual: m.qty_aktual_in })) } });
    toast('Realisasi material tersimpan ✓'); poDetail(PD.id);
  } catch (e) { toast(e.message, 'err'); }
}
function labBiaya(l) {
  const t = Number(l.tarif || 0);
  return l.sistem === 'Harian' ? (Number(l.jumlah_hari) || 0) * t : (Number(l.qty_output) || 0) * t;
}
function labRow(l, i) {
  return `<tr>
    <td><select class="tin" style="min-width:190px" onchange="labSet(${i},'tk_id',this.value)">
      <option value="">— Pilih —</option>
      ${PD.tk.map(t => `<option value="${t.id}" ${Number(l.tk_id) === t.id ? 'selected' : ''}>${esc(t.kode)} · ${esc(t.proses)} (${esc(t.sistem)})</option>`).join('')}
    </select></td>
    <td id="ls_${i}">${l.sistem ? esc(l.sistem) : '—'}</td>
    <td class="r"><input class="tin r" type="number" min="0" step="1" style="width:90px" value="${l.qty_output || ''}" ${l.sistem === 'Harian' ? 'disabled' : ''} oninput="labSet(${i},'qty_output',this.value)"></td>
    <td class="r"><input class="tin r" type="number" min="0" step="0.5" style="width:80px" value="${l.jumlah_hari || ''}" ${l.sistem !== 'Harian' ? 'disabled' : ''} oninput="labSet(${i},'jumlah_hari',this.value)"></td>
    <td class="r mono" id="lt_${i}">${rp(l.tarif || 0)}</td>
    <td class="r bold" id="lb_${i}">${rp(labBiaya(l))}</td>
    <td class="r"><button class="btn ghost sm danger-t" onclick="labDel(${i})">✕</button></td></tr>`;
}
function labSet(i, k, v) {
  const l = PD.lab[i];
  if (k === 'tk_id') {
    l.tk_id = Number(v) || null;
    const t = PD.tk.find(x => x.id === l.tk_id);
    l.sistem = t?.sistem || null; l.tarif = Number(t?.tarif || 0);
    renderLabTb(); return;
  }
  l[k] = parseFloat(v) || 0;
  document.getElementById('lb_' + i).textContent = rp(labBiaya(l));
  document.getElementById('labTot').textContent = rp(PD.lab.reduce((s, x) => s + labBiaya(x), 0));
}
function renderLabTb() {
  $('#labTb').innerHTML = PD.lab.length ? PD.lab.map((l, i) => labRow(l, i)).join('') : '<tr><td colspan="7" class="empty">Belum ada baris.</td></tr>';
  $('#labTot').textContent = rp(PD.lab.reduce((s, x) => s + labBiaya(x), 0));
}
function addLab() { PD.lab.push({ tk_id: null, qty_output: '', jumlah_hari: '', sistem: null, tarif: 0 }); renderLabTb(); }
function labDel(i) { PD.lab.splice(i, 1); renderLabTb(); }
async function saveLab() {
  const items = PD.lab.filter(l => l.tk_id).map(l => ({ tenaga_kerja_id: l.tk_id, qty_output: l.qty_output || 0, jumlah_hari: l.jumlah_hari || 0 }));
  try {
    await api('po-labor', { method: 'POST', params: { po_id: PD.id }, body: { items } });
    toast('Realisasi tenaga kerja tersimpan ✓'); poDetail(PD.id);
  } catch (e) { toast(e.message, 'err'); }
}

/* ================= PAGE: PEMBELIAN BAHAN (v1.1) ================= */
let PB_SUP = [], PB_BAHAN = [], PB_ITEMS = [], PB_CACHE = [];
async function pagePembelian() {
  setPage('Pembelian Bahan', 'Harga beli aktual dari supplier & sinkronisasi harga master');
  const [rows, sup, bh] = await Promise.all([api('pembelian'), api('supplier'), api('bahan')]);
  PB_SUP = sup; PB_BAHAN = bh; PB_CACHE = rows;
  const bulan = today().slice(0, 7);
  const totB = rows.filter(r => (r.tanggal || '').startsWith(bulan)).reduce((s, r) => s + Number(r.total || 0), 0);
  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat"><span>Pembelian — ${bulan}</span><b>${rp(totB)}</b></div>
      <div class="stat"><span>Total Transaksi</span><b>${rows.length}</b></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="mut">Nota pembelian bahan — harga di sini bisa jadi harga master terbaru</div><button class="btn" onclick="pbForm()">+ Pembelian Baru</button></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Kode</th><th>Tanggal</th><th>Supplier</th><th>No. Nota</th><th class="r">Item</th><th class="r">Total</th><th class="r">Aksi</th></tr></thead>
        <tbody>${rows.length ? rows.map(r => `<tr>
          <td class="mono">${esc(r.kode)}</td><td>${fdate(r.tanggal)}</td>
          <td><b>${esc(r.nama_supplier || '—')}</b></td><td>${esc(r.nomor_nota || '—')}</td>
          <td class="r">${r.jml_item}</td><td class="r bold">${rp(r.total)}</td>
          <td class="r"><div class="act">
            <button class="btn soft sm" onclick="pbDetail(${r.id})">Detail</button>
            <button class="btn ghost sm" onclick="pbForm(${r.id})">Edit</button>
            <button class="btn ghost sm danger-t" onclick="pbDel(${r.id})">✕</button>
          </div></td></tr>`).join('') : '<tr><td colspan="7" class="empty">Belum ada pembelian.</td></tr>'}</tbody>
      </table></div>
    </div>`;
}
async function pbForm(id) {
  if (!PB_BAHAN.length) return toast('Tambahkan Master Bahan dulu', 'err');
  let row = null;
  if (id) { const d = await api('pembelian', { params: { id } }); row = d; PB_ITEMS = d.items.map(x => ({ bahan_id: x.bahan_id, qty: Number(x.qty), harga_beli: Number(x.harga_beli) })); }
  else PB_ITEMS = [{ bahan_id: 0, qty: '', harga_beli: '' }];
  openModal(`
    <h3>${row ? 'Edit' : 'Pembelian'} Bahan</h3>
    <form id="pbf">
      <div class="grid2">
        <div class="field"><label>Supplier</label><select id="pb_sup">
          <option value="">— Tanpa supplier —</option>
          ${PB_SUP.map(s => `<option value="${s.id}" ${row && row.supplier_id === s.id ? 'selected' : ''}>${esc(s.kode)} · ${esc(s.nama)}</option>`).join('')}</select></div>
        <div class="field"><label>Tanggal</label><input id="pb_tgl" type="date" value="${row?.tanggal || today()}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>No. Nota</label><input id="pb_nota" value="${esc(row?.nomor_nota || '')}" placeholder="opsional"></div>
        <div class="field"><label>Keterangan</label><input id="pb_ket" value="${esc(row?.keterangan || '')}"></div>
      </div>
      <h4>Item Pembelian</h4>
      <div class="table-wrap"><table class="mini-table">
        <thead><tr><th>Bahan</th><th class="r">Qty</th><th class="r">Harga Beli</th><th class="r">Jumlah</th><th></th></tr></thead>
        <tbody id="pb_tb"></tbody>
        <tfoot><tr><td colspan="3" class="r bold">Total</td><td class="r bold" id="pb_tot"></td><td></td></tr></tfoot>
      </table></div>
      <button type="button" class="btn ghost sm" style="margin-top:10px" onclick="pbAdd()">+ Baris Bahan</button>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px">
        <input type="checkbox" id="pb_master" ${row ? '' : 'checked'} style="width:16px;height:16px">
        Perbarui harga master bahan dengan harga beli ini
      </label>
      <div class="form-actions"><button type="button" class="btn ghost" data-close>Batal</button><button type="submit" class="btn">Simpan</button></div>
    </form>`);
  renderPbRows();
  $('#pbf').onsubmit = async e => {
    e.preventDefault();
    const items = PB_ITEMS.filter(x => x.bahan_id && Number(x.qty) > 0);
    if (!items.length) return toast('Minimal 1 item valid', 'err');
    try {
      await api('pembelian', { method: row ? 'PUT' : 'POST', params: row ? { id: row.id } : {}, body: {
        tanggal: $('#pb_tgl').value || today(), supplier_id: Number($('#pb_sup').value) || null,
        nomor_nota: $('#pb_nota').value.trim(), keterangan: $('#pb_ket').value.trim(),
        items, update_master: $('#pb_master').checked } });
      toast('Pembelian tersimpan ✓'); closeModal(); pagePembelian();
    } catch (err) { toast(err.message, 'err'); }
  };
}
function pbRowHtml(r, i) {
  return `<tr>
    <td><select class="tin" style="min-width:190px" onchange="pbSet(${i},'bahan_id',this.value)">
      <option value="">— Pilih —</option>${bahanOptions(PB_BAHAN, r.bahan_id)}</select></td>
    <td class="r"><input class="tin r" type="number" min="0" step="any" style="width:85px" value="${r.qty}" oninput="pbSet(${i},'qty',this.value)"></td>
    <td class="r"><input class="tin r" type="number" min="0" step="any" style="width:110px" value="${r.harga_beli}" oninput="pbSet(${i},'harga_beli',this.value)"></td>
    <td class="r bold" id="pbj_${i}">${rp((Number(r.qty) || 0) * (Number(r.harga_beli) || 0))}</td>
    <td class="r"><button type="button" class="btn ghost sm danger-t" onclick="pbDelRow(${i})">✕</button></td></tr>`;
}
function renderPbRows() {
  const tb = document.getElementById('pb_tb'); if (!tb) return;
  tb.innerHTML = PB_ITEMS.map(pbRowHtml).join(''); pbTotal();
}
function pbTotal() {
  const t = PB_ITEMS.reduce((s, x) => s + (Number(x.qty) || 0) * (Number(x.harga_beli) || 0), 0);
  const el = document.getElementById('pb_tot'); if (el) el.textContent = rp(t);
}
function pbSet(i, k, v) {
  const r = PB_ITEMS[i];
  if (k === 'bahan_id') {
    r.bahan_id = Number(v) || 0;
    const b = PB_BAHAN.find(z => z.id === r.bahan_id);
    if (b) r.harga_beli = Number(b.harga);
    renderPbRows(); return;
  }
  r[k] = parseFloat(v) || 0;
  const el = document.getElementById('pbj_' + i);
  if (el) el.textContent = rp((Number(r.qty) || 0) * (Number(r.harga_beli) || 0));
  pbTotal();
}
function pbAdd() { PB_ITEMS.push({ bahan_id: 0, qty: '', harga_beli: '' }); renderPbRows(); }
function pbDelRow(i) { PB_ITEMS.splice(i, 1); renderPbRows(); }
async function pbDetail(id) {
  openModal('<div class="empty">Memuat…</div>');
  try {
    const d = await api('pembelian', { params: { id } });
    const tot = (d.items || []).reduce((s, x) => s + Number(x.qty) * Number(x.harga_beli), 0);
    openModal(`
      <div style="display:flex;justify-content:space-between;align-items:center">

        <button class="btn ghost sm" data-close>✕</button></div>
      <p class="mut" style="margin-top:4px">${esc(d.supplier?.nama || 'Tanpa supplier')}${d.nomor_nota ? ' · Nota: ' + esc(d.nomor_nota) : ''}${d.keterangan ? ' · ' + esc(d.keterangan) : ''}</p>
      <div class="table-wrap"><table class="mini-table">
        <thead><tr><th>Bahan</th><th class="r">Qty</th><th class="r">Harga Beli</th><th class="r">Jumlah</th></tr></thead>
        <tbody>${d.items.map(x => `<tr><td><b>${esc(x.bahan?.nama)}</b> <small class="mono">${esc(x.bahan?.kode)}</small></td><td class="r">${nf(x.qty)} <small class="mono">${esc(x.bahan?.satuan || '')}</small></td><td class="r">${rp(x.harga_beli)}</td><td class="r bold">${rp(Number(x.qty) * Number(x.harga_beli))}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="3" class="r bold">Total</td><td class="r bold">${rp(tot)}</td></tr></tfoot>
      </table></div>`);
  } catch (e) { openModal(`<div class="empty">⚠ ${esc(e.message)}</div>`); }
}
function pbDel(id) {
  openModal(`<h3>Hapus pembelian ini?</h3><p class="mut">Item di dalamnya juga terhapus. Harga master tidak ikut berubah.</p>
    <div class="form-actions"><button class="btn ghost" data-close>Batal</button><button class="btn danger" id="dl">Ya, Hapus</button></div>`);

    try { await api('pembelian', { method: 'DELETE', params: { id } }); toast('Pembelian dihapus'); closeModal(); pagePembelian(); }

  };
}

function jPrev() {
  const g = id => parseFloat(document.getElementById(id).value) || 0;

function invRowHtml(r, i) {

    <td class="r bold" id="ivj_${i}">${rp((Number(r.qty) || 0) * (Number(r.harga) || 0) * (1 - (Number(r.diskon_pct) || 0) / 100))}</td>
    <td class="r"><button type="button" class="btn ghost sm danger-t" onclick="invDelRow(${i})">✕</button></td></tr>`;
}
function renderInvRows() {
  const tb = document.getElementById('iv_tb'); if (!tb) return;
  tb.innerHTML = INV_ITEMS.length ? INV_ITEMS.map(invRowHtml).join('') : '<tr><td colspan="6" class="empty">Klik “+ Baris Produk”.</td></tr>';
  invPrev();
}
function invSet(i, k, v) {
  const r = INV_ITEMS[i]; INV_DIRTY = true;
  if (k === 'produk_id') {
    r.produk_id = Number(v) || 0;
    const p = INV_PRODUK.find(x => x.id === r.produk_id);
    if (p) r.harga = Number(p.harga_jual);
    renderInvRows(); return;
  }
  r[k] = parseFloat(v) || 0;
  const j = document.getElementById('ivj_' + i);
  if (j) j.textContent = rp((Number(r.qty) || 0) * (Number(r.harga) || 0) * (1 - (Number(r.diskon_pct) || 0) / 100));
  invPrev();
}
function invAdd() { INV_ITEMS.push({ produk_id: 0, qty: 1, harga: 0, diskon_pct: 0 }); INV_DIRTY = true; renderInvRows(); }
function invDelRow(i) { INV_ITEMS.splice(i, 1); INV_DIRTY = true; renderInvRows(); }
function invTotCalc() {
  const g = x => parseFloat(document.getElementById(x)?.value) || 0;
  const sub = INV_ITEMS.reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.harga) || 0) * (1 - (Number(i.diskon_pct) || 0) / 100), 0);
  const dpp = Math.max(sub - g('iv_pot'), 0);
  const pajak = dpp * g('iv_pjk') / 100;
  const total = dpp + pajak + g('iv_ongkir');
  return { sub, pajak, total, sisa: Math.max(0, total - g('iv_bayar')) };
}
function invPrev() {
  const el = document.getElementById('iv_prev'); if (!el) return;
  const t = invTotCalc();

}

}

function invPaper(d, sisa) {
  const s = d.set || {};
  const pajakRp = Number(d.total) - Number(d.ongkir || 0) - Math.max(Number(d.subtotal || 0) - Number(d.potongan || 0), 0);
  const initial = esc((s.nama_usaha || 'U').trim().charAt(0).toUpperCase());
  const logo = s.logo_url
    ? `<img src="${esc(s.logo_url)}" style="height:46px;border-radius:8px;margin-bottom:6px" alt="logo">`
    : `<div style="width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:6px">${initial}</div>`;
  return `<div class="inv" id="invPaper">
    <div class="inv-head">
      <div>${logo}<b style="font-size:16px">${esc(s.nama_usaha || '—')}</b>
        ${s.alamat ? `<div class="mut" style="white-space:pre-line">${esc(s.alamat)}</div>` : ''}
        <div class="mut">${esc([s.telepon, s.email].filter(Boolean).join(' · '))}</div></div>
      <div style="text-align:right">
        <div style="font-size:21px;font-weight:800;letter-spacing:4px;color:var(--ac)">INVOICE</div>
        <div class="mono" style="font-size:12px">${esc(d.nomor)}</div>
        <div class="mut" style="font-size:11.5px;margin-top:4px">Tanggal: ${fdate(d.tanggal)}</div>
        <div class="mut" style="font-size:11.5px">Jatuh Tempo: ${fdate(d.jatuh_tempo)}</div>
        <div style="margin-top:6px">${payBadge(d.status_bayar)}</div>
      </div>
    </div>
    <div style="margin-bottom:14px">
      <div class="mut" style="font-size:10px;letter-spacing:1px;font-weight:700;margin-bottom:3px">DITAGIHKAN KEPADA</div>
      <b>${esc(d.customer_nama)}</b>
      ${d.customer_alamat ? `<div class="mut" style="white-space:pre-line">${esc(d.customer_alamat)}</div>` : ''}
      ${d.customer_telepon || d.customer_email ? `<div class="mut">${esc([d.customer_telepon, d.customer_email].filter(Boolean).join(' · '))}</div>` : ''}
    </div>
    <div class="table-wrap"><table class="inv-table">
      <thead><tr><th class="c">#</th><th>Deskripsi</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Disc</th><th class="r">Jumlah</th></tr></thead>
      <tbody>${(d.items || []).map((it, ix) => `<tr>
        <td class="c mut">${ix + 1}</td>
        <td><b>${esc(it.deskripsi || it.produk?.nama || '—')}</b> <small class="mono">${esc(it.produk?.kode || '')}</small></td>
        <td class="r">${nf(it.qty)}</td>
        <td class="r">${rp(it.harga)}</td>
        <td class="r">${Number(it.diskon_pct) ? pct(it.diskon_pct) : '—'}</td>
        <td class="r bold">${rp(Number(it.qty) * Number(it.harga) * (1 - Number(it.diskon_pct || 0) / 100))}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="inv-totals">
      <div class="kv"><span>Subtotal</span><b>${rp(d.subtotal)}</b></div>
      ${Number(d.potongan) ? `<div class="kv"><span>Potongan</span><b>- ${rp(d.potongan)}</b></div>` : ''}
      ${Number(d.pajak_pct) ? `<div class="kv"><span>Pajak ${pct(d.pajak_pct)}</span><b>${rp(pajakRp)}</b></div>` : ''}
      ${Number(d.ongkir) ? `<div class="kv"><span>Ongkos Kirim</span><b>${rp(d.ongkir)}</b></div>` : ''}
      <div class="kv grand"><span>TOTAL</span><b>${rp(d.total)}</b></div>
      ${Number(d.nominal_bayar) ? `<div class="kv"><span>Dibayar${d.metode_bayar ? ' (' + esc(d.metode_bayar) + ')' : ''}</span><b class="up">- ${rp(d.nominal_bayar)}</b></div>
      <div class="kv grand"><span>SISA</span><b class="${sisa > 0 ? 'down' : 'up'}">${rp(sisa)}</b></div>` : ''}
    </div>
    ${s.rekening ? `<div class="inv-pay"><b>💳 Pembayaran</b><div style="white-space:pre-line;margin-top:4px">${esc(s.rekening)}</div></div>` : ''}
    ${d.catatan ? `<div class="inv-note"><b>Catatan:</b> <span style="white-space:pre-line">${esc(d.catatan)}</span></div>` : ''}
    <div class="inv-foot">${esc(s.footer_invoice || 'Terima kasih!')}</div>
  </div>`;
}
function waInv() {
  const d = INV_VIEW; if (!d) return;
  const s = d.set || {};
  const sisa = Math.max(0, Number(d.total) - Number(d.nominal_bayar));
  const L = [];
  L.push(`*INVOICE ${d.nomor}*`);
  L.push(s.nama_usaha || '');
  L.push('');
  L.push(`Kepada: *${d.customer_nama}*`);
  L.push(`Tanggal: ${fdate(d.tanggal)}${d.jatuh_tempo ? ` | Tempo: ${fdate(d.jatuh_tempo)}` : ''}`);
  L.push('');
  L.push('*Rincian:*');
  (d.items || []).forEach((it, i) => L.push(`${i + 1}. ${it.deskripsi || it.produk?.nama || ''} (${nf(it.qty)} x ${rp(it.harga)}${Number(it.diskon_pct) ? ` -${pct(it.diskon_pct)}` : ''}) = *${rp(Number(it.qty) * Number(it.harga) * (1 - Number(it.diskon_pct || 0) / 100))}*`));
  L.push('');
  if (Number(d.potongan)) L.push(`Potongan: -${rp(d.potongan)}`);
  if (Number(d.ongkir)) L.push(`Ongkir: ${rp(d.ongkir)}`);
  L.push(`*TOTAL: ${rp(d.total)}*`);
  if (Number(d.nominal_bayar)) { L.push(`Dibayar: ${rp(d.nominal_bayar)}`); L.push(`*Sisa: ${rp(sisa)}*`); }
  L.push('');
  L.push(`Status: *${d.status_bayar}*`);
  if (s.rekening) L.push('');
  if (s.rekening) L.push('Pembayaran:');
  if (s.rekening) L.push(s.rekening);
  if (d.catatan) { L.push(''); L.push('_' + d.catatan + '_'); }
  L.push('');
  L.push(s.footer_invoice || 'Terima kasih 🙏');
  const ph = (d.customer_telepon || '').replace(/\D/g, '').replace(/^0/, '62');
  const url = ph
    ? `https://wa.me/${ph}?text=${encodeURIComponent(L.join('\n'))}`
    : `https://api.whatsapp.com/send?text=${encodeURIComponent(L.join('\n'))}`;
  window.open(url, '_blank');
}
async function invLunas(id) {
  const r = INV_CACHE.find(x => x.id === id) || (INV_VIEW && INV_VIEW.id === id ? INV_VIEW : null);
  const total = Number(r?.total || 0);
  try {
    await api('invoice', { method: 'PUT', params: { id }, body: { status_bayar: 'Lunas', nominal_bayar: total } });
    toast('Invoice ditandai LUNAS ✓');
    if (INV_VIEW && INV_VIEW.id === id && document.getElementById('invPaper')) invView(id);
    else pageInvoice();
  } catch (e) { toast(e.message, 'err'); }
}
function invDel(id) {
  openModal(`<h3>Hapus invoice ini?</h3><p class="mut">Baris penjualan yang dibuat otomatis dari invoice ini ikut dihapus. Transaksi yang hanya ditautkan akan dilepas (tetap ada di Penjualan).</p>
    <div class="form-actions"><button class="btn ghost" data-close>Batal</button><button class="btn danger" id="dl">Ya, Hapus</button></div>`);
  $('#dl').onclick = async () => {
    try { await api('invoice', { method: 'DELETE', params: { id } }); toast('Invoice dihapus'); closeModal(); pageInvoice(); }
    catch (e) { toast(e.message, 'err'); }
  };
}

/* ================= PAGE: PENGATURAN (v1.1) ================= */

  setPage('Pengaturan', 'Profil usaha — tampil di kop invoice & pesan WhatsApp');
  const s = await api('pengaturan');
  $('#content').innerHTML = `
    <div class="card" style="max-width:680px">
      <div class="card-head"><b>Profil Usaha</b></div>
      <div style="padding:16px">
        <div class="grid2">
          <div class="field"><label>Nama Usaha *</label><input id="s_nama" value="${esc(s.nama_usaha || '')}"></div>
          <div class="field"><label>Telepon</label><input id="s_telp" value="${esc(s.telepon || '')}"></div>
        </div>
        <div class="field"><label>Alamat</label><textarea id="s_alamat" rows="2">${esc(s.alamat || '')}</textarea></div>
        <div class="grid2">
          <div class="field"><label>Email</label><input id="s_email" value="${esc(s.email || '')}"></div>
          <div class="field"><label>Logo (URL gambar, opsional)</label><input id="s_logo" value="${esc(s.logo_url || '')}" placeholder="https://…"></div>
        </div>
        <div class="field"><label>Rekening Pembayaran (tampil di invoice & WA)</label><textarea id="s_rek" rows="3" placeholder="BCA 1234567890 a.n. Nama Anda">${esc(s.rekening || '')}</textarea></div>
        <div class="field"><label>Catatan Default Invoice</label><input id="s_cat" value="${esc(s.catatan_invoice || '')}"></div>
        <div class="field"><label>Footer Invoice</label><input id="s_foot" value="${esc(s.footer_invoice || '')}"></div>
        <div class="form-actions"><button class="btn" id="s_save">Simpan Pengaturan</button></div>
      </div>
    </div>`;
  $('#s_save').onclick = async () => {
    try {
      await api('pengaturan', { method: 'PUT', body: {
        nama_usaha: $('#s_nama').value.trim(), alamat: $('#s_alamat').value.trim(),
        telepon: $('#s_telp').value.trim(), email: $('#s_email').value.trim(),
        logo_url: $('#s_logo').value.trim(), rekening: $('#s_rek').value.trim(),
        catatan_invoice: $('#s_cat').value.trim(), footer_invoice: $('#s_foot').value.trim() } });
      toast('Pengaturan tersimpan ✓');
    } catch (e) { toast(e.message, 'err'); }
  };
}

/* ================= PAGE: DASHBOARD ================= */
async function pageDashboard() {
  setPage('Dashboard', 'Ringkasan performa produksi, penjualan & piutang');
  const d = await api('dashboard');
  const max = Math.max(...d.chart.map(c => c.nilai), 1);
  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat"><span>Net Sales — ${d.periode}</span><b>${rp(d.bulan_ini.net_sales)}</b></div>
      <div class="stat"><span>Laba Bersih — ${d.periode}</span><b class="${d.bulan_ini.laba >= 0 ? 'up' : 'down'}">${rp(d.bulan_ini.laba)}</b><small>Margin ${pct(d.bulan_ini.margin_pct)}</small></div>
      <div class="stat"><span>HPP Terjual — ${d.periode}</span><b>${rp(d.bulan_ini.hpp)}</b></div>
      <div class="stat"><span>Piutang Invoice</span><b class="${d.piutang_invoice > 0 ? 'down' : 'up'}">${rp(d.piutang_invoice)}</b><small>Belum dibayar pelanggan</small></div>
      <div class="stat"><span>Pembelian — ${d.periode}</span><b>${rp(d.pembelian_bulan)}</b></div>
      <div class="stat"><span>PO Berjalan</span><b>${d.counts.po_aktif}</b><small>${d.counts.produk} produk · ${d.counts.bahan} bahan</small></div>
    </div>
    <div class="card">
      <div class="card-head"><b>Penjualan 14 Hari Terakhir</b><span class="chip">Net Sales / hari</span></div>
      <div style="padding:16px"><div class="chart">
        ${d.chart.map(c => `<div class="col" title="${fdate(c.tanggal)}: ${rp(c.nilai)}">
          <div class="bar" style="height:${Math.max(2, c.nilai / max * 118)}px"></div>
          <span class="lbl">${c.tanggal.slice(8)}</span></div>`).join('')}
      </div></div>
    </div>
    <div class="grid2c">
      <div class="card">
        <div class="card-head"><b>HPP Terbaru</b><button class="btn ghost sm" onclick="go('hpp')">Lihat semua</button></div>
        <div class="table-wrap"><table class="mini-table">
          <thead><tr><th>PO</th><th>Produk</th><th class="r">HPP / pcs</th><th>Status</th></tr></thead>
          <tbody>${d.hpp_terbaru.length ? d.hpp_terbaru.map(h => `<tr style="cursor:pointer" onclick="showHppBreakdown(${h.id})"><td class="mono">${esc(h.kode_po)}</td><td>${esc(h.nama_produk)}</td><td class="r bold">${rp(h.hpp_per_pcs)}</td><td>${stBadge(h.status)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">Belum ada PO.</td></tr>'}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><b>Invoice Terbaru</b><button class="btn ghost sm" onclick="go('invoice')">Lihat semua</button></div>
        <div class="table-wrap"><table class="mini-table">
          <thead><tr><th>Nomor</th><th>Pelanggan</th><th class="r">Total</th><th>Status</th></tr></thead>
          <tbody>${(d.invoice_terbaru || []).length ? d.invoice_terbaru.map(v => `<tr style="cursor:pointer" onclick="invView(${v.id})"><td class="mono">${esc(v.nomor)}</td><td>${esc(v.customer_nama)}</td><td class="r bold">${rp(v.total)}</td><td>${payBadge(v.status_bayar)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">Belum ada invoice.</td></tr>'}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><b>Penjualan Terbaru</b><button class="btn ghost sm" onclick="go('penjualan')">Lihat semua</button></div>
        <div class="table-wrap"><table class="mini-table">
          <thead><tr><th>Tanggal</th><th>Produk</th><th class="r">Net</th><th class="r">Laba</th></tr></thead>
          <tbody>${d.penjualan_terbaru.length ? d.penjualan_terbaru.map(j => `<tr><td>${fdate(j.tanggal)}</td><td>${esc(j.nama_produk)}<br><span class="badge b-indigo" style="margin-top:2px">${esc(j.channel)}</span></td><td class="r">${rp(j.net_sales)}</td><td class="r ${Number(j.laba_bersih) >= 0 ? 'up' : 'down'}">${rp(j.laba_bersih)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">Belum ada penjualan.</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>`;
}
