<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#003399"/>
<title>FinKuvek — Finance Manufaktur Konveksi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23003399'/><text x='50' y='70' font-size='52' font-weight='800' text-anchor='middle' fill='%23FFCC00' font-family='sans-serif'>F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   v1.5 — "BLUE × YELLOW" · nama aplikasi dari menu Pengaturan
   ============================================================ */
:root{
  --ink:#002B80; --ink2:#003399;
  --brand-700:#003399; --brand-800:#002773; --brand-600:#1A4DBF;
  --brand-100:#D6E2FF; --brand-50:#F0F5FF;
  --acc-500:#FFCC00; --acc-600:#E6B800;
  --acc-100:#FFF3B3; --acc-50:#FFFAE6;
  --bg:#F5F6F8; --card:#FFFFFF; --line:#E4E7EC; --line2:#EEF0F4;
  --tx:#101828; --tx2:#475467; --tx3:#667085;
  --ok:#067647; --ok-bg:#ECFDF3;
  --bad:#B42318; --bad-bg:#FEF3F2;
  --warn:#93370D; --warn-bg:#FFFAEB;
  --r:14px;
  --sh1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sh2:0 6px 16px rgba(16,24,40,.10),0 2px 4px rgba(16,24,40,.06);
  --dur1:130ms; --dur2:220ms;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:13.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
::selection{background:var(--acc-500);color:var(--brand-800)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.up{color:var(--ok)} .down{color:var(--bad)} .mut{color:var(--tx2);font-size:12.5px}
h1,h2,h3{letter-spacing:-.02em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand-700);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-9999px;top:0;background:var(--brand-800);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;z-index:300;font-weight:600}
.skip:focus{left:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ SIDEBAR ============ */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:252px;background:linear-gradient(180deg,var(--ink2),var(--ink));display:flex;flex-direction:column;z-index:50;transition:transform .25s var(--ease)}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 16px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:var(--acc-500);color:var(--brand-800);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 2px 8px rgba(255,204,0,.35)}
.brand-text b{display:block;font-size:15.5px;color:#fff;letter-spacing:-.02em}
.brand-text span{font-size:10.5px;color:#9DB4E8}
nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
nav::-webkit-scrollbar{width:4px} nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
.nav-group{margin:16px 4px 5px;font-size:9.5px;letter-spacing:1.4px;font-weight:700;color:#7E9BDD;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#CBD8F5;cursor:pointer;font-weight:500;margin-bottom:2px;min-height:44px;border:none;background:none;width:100%;font-size:13.5px;text-align:left;position:relative;transition:background var(--dur1) var(--ease),color var(--dur1) var(--ease)}
.nav-item svg{width:18px;height:18px;flex:none;fill:currentColor;opacity:.78}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:rgba(255,204,0,.14);color:var(--acc-500);font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc-500)}
.nav-item:focus-visible{outline-color:var(--acc-500)}
.sidebar-foot{padding:14px 18px;font-size:10.5px;color:#7E9BDD;border-top:1px solid rgba(255,255,255,.1)}
.overlay{position:fixed;inset:0;background:rgba(0,43,128,.5);z-index:40;display:none;backdrop-filter:blur(2px)}
.overlay.show{display:block}

/* ============ MAIN ============ */
.main{margin-left:252px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,246,248,.88);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:800}
.topbar p{font-size:12px;color:var(--tx3)}
.icon-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:17px;flex:none}
.content{padding:22px 24px 56px;max-width:1300px;width:100%;flex:1}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 50px rgba(0,0,0,.35)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .content{padding:16px 14px 56px}
  .topbar{padding:12px 14px}
}
@media(min-width:901px){
  body.sb-collapsed .sidebar{transform:translateX(-100%)}
  body.sb-collapsed .main{margin-left:0}
}

/* ============ CARD ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);margin-bottom:18px;overflow:hidden}
.stats>.stat,.card{animation:pageIn var(--dur2) var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-head b{font-size:14px;font-weight:700}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;padding:11px 16px;background:#F8F9FB;color:var(--tx3);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--dur1) var(--ease)}
tbody tr:hover{background:#F5F8FF}
.mini-table{min-width:0;font-size:12.5px}
.mini-table th,.mini-table td{padding:8px 10px}
.r{text-align:right} .c{text-align:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--tx3)}
.bold{font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--tx2);font-size:13px}
.empty .e-ic{font-size:26px;display:block;margin-bottom:8px;opacity:.6}
.empty .e-t{font-weight:700;color:var(--tx);display:block;margin-bottom:2px}
tfoot td{border-top:1px solid var(--line);border-bottom:none;background:#F8F9FB}

/* ============ BUTTON ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand-700);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;min-height:42px;transition:background var(--dur1) var(--ease),transform var(--dur1) var(--ease),box-shadow var(--dur1) var(--ease);white-space:nowrap}
.btn:hover{background:var(--brand-800);box-shadow:var(--sh1)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{background:#F8F9FB;box-shadow:none}
.btn.soft{background:var(--brand-50);color:var(--brand-800)}
.btn.soft:hover{background:var(--brand-100)}
.btn.acc{background:var(--acc-500);color:var(--brand-800)}
.btn.acc:hover{background:var(--acc-600)}
.btn.danger{background:var(--bad)} .btn.danger:hover{background:#912018}
.btn.sm{padding:6px 11px;min-height:36px;font-size:12px;border-radius:9px}
.danger-t{color:var(--bad)!important}
.act{display:flex;gap:6px;justify-content:flex-end}

/* ============ BADGE & CHIP ============ */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:var(--ok-bg);color:var(--ok)}
.b-amber{background:var(--warn-bg);color:var(--warn)}
.b-red{background:var(--bad-bg);color:var(--bad)}
.b-gray{background:#F2F4F7;color:#344054}
.b-blue{background:var(--brand-50);color:var(--brand-800)}
.chip{background:var(--acc-500);color:var(--brand-800);font-weight:800;font-size:12px;padding:7px 13px;border-radius:99px;white-space:nowrap}

/* ============ STAT ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh1);transition:transform var(--dur1) var(--ease),box-shadow var(--dur1) var(--ease)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.stat span{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:7px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat small{display:block;font-size:11px;color:var(--tx2);margin-top:5px}
.stat.hi{background:linear-gradient(180deg,#F0F5FF,#E7EEFF);border-color:#C3D4FB}
.stat.hi b{color:var(--brand-800)}

/* ============ GRID / KV ============ */
.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid2c{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--tx2)}

/* ============ CHART ============ */
.chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0;height:100%}
.chart .bar{width:100%;max-width:26px;background:linear-gradient(180deg,var(--brand-600),var(--brand-700));border-radius:6px 6px 3px 3px;min-height:3px;transition:filter var(--dur1)}
.chart .col:hover .bar{filter:brightness(1.18)}
.chart .bar.acc{background:linear-gradient(180deg,var(--acc-500),var(--acc-600))}
.chart .lbl{font-size:9.5px;color:var(--tx3)}

/* ============ FORM & MODAL ============ */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:var(--card);min-height:44px;color:var(--tx);transition:border-color var(--dur1),box-shadow var(--dur1)}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(26,77,191,.15)}
@media(pointer:coarse){.field input,.field select,.field textarea,.tin{font-size:16px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,43,128,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn var(--dur1) var(--ease)}
.modal-backdrop.show{display:flex}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--card);width:100%;max-width:580px;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:20px;animation:sheetUp .24s var(--ease)}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:16px;animation:pop .18s var(--ease)}}
@keyframes sheetUp{from{transform:translateY(48px);opacity:0}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal h3{font-size:16px;font-weight:800;margin-bottom:12px}
.modal h4{font-size:13px;font-weight:700;margin:16px 0 8px}

/* ============ SEARCH & TABEL INPUT ============ */
.search{position:relative;flex:1;max-width:280px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;font-size:13px;font-family:inherit;min-height:42px;background:var(--card)}
.search input:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(26,77,191,.15);outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:none;stroke:var(--tx3);stroke-width:2;stroke-linecap:round}
.tin{border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--card);min-height:38px;color:var(--tx)}
.tin:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(26,77,191,.15);outline:none}
.tin.r{text-align:right}
select.tin{padding-right:6px}

/* ============ PREVIEW / HIGHLIGHT ============ */
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#F8F9FB;border:1px solid var(--line2);border-radius:12px;padding:12px;margin-top:4px}
.preview span{display:block;font-size:10.5px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.preview b{font-size:12.5px}
.margin-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--brand-50);border:1px solid #C3D4FB;border-radius:12px;padding:12px;margin-top:14px}
.margin-box span{display:block;font-size:10.5px;color:var(--tx2)}
.margin-box b{font-size:13px}

/* ============ SKELETON ============ */
.sk{position:relative;overflow:hidden;background:var(--line2);border-radius:8px;height:12px}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shim 1.2s linear infinite}
@keyframes shim{to{transform:translateX(100%)}}
.sk-tr td{padding:13px 16px}

/* ============ LOGO ============ */
.logo-tile{width:76px;height:76px;border-radius:14px;background:var(--acc-50);border:2px dashed var(--acc-600);display:grid;place-items:center;overflow:hidden;flex:none;font-size:28px;font-weight:800;color:var(--brand-800)}
.logo-tile img{width:100%;height:100%;object-fit:contain;background:#fff}

/* ============ INVOICE PAPER ============ */
.inv{background:#fff;color:#111;font-size:12.5px}
.inv table{min-width:0}
.inv-table th{background:#F4F6FA;color:#344054;font-size:10px}
.inv-table td{padding:9px 10px;border-bottom:1px solid #EEF0F4}
.inv-head{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:3px solid var(--brand-700);margin-bottom:16px}
@media(max-width:520px){.inv-head{flex-direction:column}}
.inv-word{font-size:21px;font-weight:800;letter-spacing:5px;color:var(--brand-800)}
.inv-rule{width:38px;height:3px;background:var(--acc-500);border-radius:2px;margin:5px 0 6px auto}
.inv-totals{margin-left:auto;max-width:320px;margin-top:14px}
.inv-totals .kv{padding:6px 0;font-size:12.5px}
.inv-totals .grand{border-top:2px solid #101828;font-size:14px;padding-top:8px;margin-top:4px}
.inv-totals .grand b{font-weight:800}
.inv-pay{margin-top:16px;background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:12px}
.inv-note{margin-top:10px;font-size:12px}
.inv-foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);text-align:center;color:var(--tx3);font-size:11px}

/* ============ PRINT ============ */
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body.print-mode>*:not(#printArea){display:none!important}
  body.print-mode{background:#fff}
  body.print-mode #printArea{display:block!important}
  .inv{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--brand-800);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;animation:sheetUp .2s var(--ease);box-shadow:var(--sh2);max-width:100%;border-left:3px solid var(--acc-500)}
.toast.err{background:var(--bad);border-left-color:#FDA29B}
</style>
</head>
<body>

<a class="skip" href="#content">Langsung ke konten</a>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-logo" id="brandLogo">FK</div>
    <div class="brand-text"><b id="brandName">FinKuvek</b><span id="brandTag">Finance Manufaktur Konveksi</span></div>
  </div>
  <nav id="nav" aria-label="Menu utama"></nav>
  <div class="sidebar-foot">v1.5 · Blue × Yellow</div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="Buka / tutup menu">☰</button>
    <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub"></p></div>
  </header>
  <div class="content" id="content" tabindex="-1"></div>
</main>

<div class="modal-backdrop" id="modalBack"><div class="modal" id="modalBox" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>
<div id="printArea"></div>

<script>
/* ============================================================
   IDENTITAS APLIKASI — diatur lewat menu PENGATURAN (database).
   Nilai default di bawah dipakai sebelum data terbaca /
   bila kolom di Pengaturan masih kosong.
   ============================================================ */
const APP_DEFAULTS = { nama: 'FinKuvek', inisial: 'FK', tagline: 'Finance Manufaktur Konveksi' };
let APP = { ...APP_DEFAULTS };

function applyBrand() {
  document.title = APP.nama + (APP.tagline ? ' — ' + APP.tagline : '');
  const bl = document.getElementById('brandLogo'); if (bl) bl.textContent = APP.inisial;
  const bn = document.getElementById('brandName'); if (bn) bn.textContent = APP.nama;
  const bt = document.getElementById('brandTag');  if (bt) bt.textContent = APP.tagline;
  const fv = document.querySelector('link[rel="icon"]');
  if (fv) fv.href = 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='#003399'/><text x='50' y='70' font-size='52' font-weight='800' text-anchor='middle' fill='#FFCC00' font-family='sans-serif'>${APP.inisial}</text></svg>`);
}
function setAppFromSettings(s) {
  APP = {
    nama:    (s?.nama_aplikasi    || '').trim() || APP_DEFAULTS.nama,
    inisial: ((s?.inisial_aplikasi || '').trim().slice(0, 3).toUpperCase()) || APP_DEFAULTS.inisial,
    tagline: (s?.tagline_aplikasi || '').trim() || APP_DEFAULTS.tagline,
  };
  applyBrand();
}

/* ================= HELPER ================= */
const $ = s => document.querySelector(s);
const rp  = n => 'Rp ' + Math.round(Number(n || 0)).toLocaleString('id-ID');
const rp2 = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf  = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const pct = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fdate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';

async function api(func, { method = 'GET', params = {}, body } = {}) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`/api/${func}${qs ? '?' + qs : ''}`, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {}; try { j = await res.json(); } catch {}
  if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
  return j;
}
function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'err' ? ' err' : '');
  t.textContent = msg;

      <td class="r bold num" id="ef_${i}">${nf(ef)} <small class="mono">${esc(b?.satuan || '')}</small></td>
      <td class="r mono num" id="hg_${i}">${rp(b?.harga || 0)}</td>
      <td class="r bold num" id="by_${i}">${rp(ef * (b?.harga || 0))}</td>
      <td class="r"><button class="btn ghost sm danger-t" aria-label="Hapus baris" onclick="bomDel(${i})">✕</button></td>
    </tr>`;
  }).join('');
  bomTotal();
}
function bomSet(i, k, v) {
  const r = BROWS[i];
  if (k === 'bahan_id') r.bahan_id = Number(v) || 0; else r[k] = parseFloat(v) || 0;
  const b = BL.find(x => x.id === Number(r.bahan_id));
  const ef = (Number(r.qty_standar) || 0) * (1 + (Number(r.waste_pct) || 0) / 100);
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('ef_' + i, nf(ef) + ' <small class="mono">' + esc(b?.satuan || '') + '</small>');
  if (k === 'bahan_id') set('hg_' + i, rp(b?.harga || 0));
  set('by_' + i, rp(ef * (b?.harga || 0)));
  bomTotal();
}
function bomTotal() {
  const el = $('#bomTotal'); if (!el) return;
  let t = 0;
  BROWS.forEach(r => {
    const b = BL.find(x => x.id === Number(r.bahan_id));
    t += (Number(r.qty_standar) || 0) * (1 + (Number(r.waste_pct) || 0) / 100) * (b?.harga || 0);
  });
  el.textContent = 'DM / pcs: ' + rp(t);
}
function bomDel(i) { BROWS.splice(i, 1); renderBomRows(); }
async function saveBom() {
  if (!BPID) return toast('Pilih produk dulu', 'err');
  const items = BROWS.filter(r => Number(r.bahan_id) > 0 && Number(r.qty_standar) > 0);
  if (!items.length) return toast('Minimal 1 baris bahan valid', 'err');
  try {
    await api('bom', { method: 'POST', body: { produk_id: Number(BPID), items } });
    toast('BOM tersimpan ✓');
  } catch (e) { toast(e.message, 'err'); }
}

function labBiaya(l) {

function labSet(i, k, v) {

function pbTotal() {

function pbSet(i, k, v) {

function invRowHtml(r, i) {
  return `<tr>
    <td><select class="tin" style="min-width:190px" aria-label="Produk" onchange="invSet(${i},'produk_id',this.value)">

    <td class="r bold num" id="ivj_${i}">${rp((Number(r.qty) || 0) * (Number(r.harga) || 0) * (1 - (Number(r.diskon_pct) || 0) / 100))}</td>
    <td class="r"><button type="button" class="btn ghost sm danger-t" aria-label="Hapus baris" onclick="invDelRow(${i})">✕</button></td></tr>`;
}
function renderInvRows() {
  const tb = document.getElementById('iv_tb'); if (!tb) return;
  tb.innerHTML = INV_ITEMS.length ? INV_ITEMS.map(invRowHtml).join('') : `<tr><td colspan="6">${emptyState('➕','Klik “+ Baris Produk”','')}</td></tr>`;
  invPrev();
}
function invSet(i, k, v) {
  const r = INV_ITEMS[i]; INV_DIRTY = true;
  if (k === 'produk_id') {
    r.produk_id = Number(v) || 0;
    const p = INV_PRODUK.find(x => x.id === r.produk_id);
    if (p) r.harga = Number(p.harga_jual);
    renderInvRows(); return;
  }
  r[k] = parseFloat(v) || 0;
  const j = document.getElementById('ivj_' + i);
  if (j) j.textContent = rp((Number(r.qty) || 0) * (Number(r.harga) || 0) * (1 - (Number(r.diskon_pct) || 0) / 100));
  invPrev();
}
function invAdd() { INV_ITEMS.push({ produk_id: 0, qty: 1, harga: 0, diskon_pct: 0 }); INV_DIRTY = true; renderInvRows(); }
function invDelRow(i) { INV_ITEMS.splice(i, 1); INV_DIRTY = true; renderInvRows(); }
function invTotCalc() {
  const g = x => parseFloat(document.getElementById(x)?.value) || 0;
  const sub = INV_ITEMS.reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.harga) || 0) * (1 - (Number(i.diskon_pct) || 0) / 100), 0);
  const dpp = Math.max(sub - g('iv_pot'), 0);
  const pajak = dpp * g('iv_pjk') / 100;
  const total = dpp + pajak + g('iv_ongkir');
  return { sub, pajak, total, sisa: Math.max(0, total - g('iv_bayar')) };
}
function invPrev() {
  const el = document.getElementById('iv_prev'); if (!el) return;
  const t = invTotCalc();
  el.innerHTML = `
    <div><span>Subtotal</span><b>${rp(t.sub)}</b></div>
    <div><span>Pajak</span><b>${rp(t.pajak)}</b></div>
    <div><span>Ongkir</span><b>${rp(parseFloat(document.getElementById('iv_ongkir')?.value) || 0)}</b></div>
    <div><span>Total Tagihan</span><b>${rp(t.total)}</b></div>
    <div><span>Sisa</span><b class="${t.sisa > 0 ? 'down' : 'up'}">${rp(t.sisa)}</b></div>`;
}
function ivStatus() {
  const st = document.getElementById('iv_st').value;
  if (st === 'Lunas') document.getElementById('iv_bayar').value = Math.round(invTotCalc().total);
  if (st === 'Belum Bayar') document.getElementById('iv_bayar').value = 0;
  invPrev();
}

function waInv() {
  const d = INV_VIEW; if (!d) return;
  const s = d.set || {};
  const sisa = Math.max(0, Number(d.total) - Number(d.nominal_bayar));
  const L = [];
  L.push(`*INVOICE ${d.nomor}*`);
  L.push(s.nama_usaha || '');
  L.push('');
  L.push(`Kepada: *${d.customer_nama}*`);
  L.push(`Tanggal: ${fdate(d.tanggal)}${d.jatuh_tempo ? ` | Tempo: ${fdate(d.jatuh_tempo)}` : ''}`);
  L.push('');
  L.push('*Rincian:*');
  (d.items || []).forEach((it, i) => L.push(`${i + 1}. ${it.deskripsi || it.produk?.nama || ''} (${nf(it.qty)} x ${rp(it.harga)}${Number(it.diskon_pct) ? ` -${pct(it.diskon_pct)}` : ''}) = *${rp(Number(it.qty) * Number(it.harga) * (1 - Number(it.diskon_pct || 0) / 100))}*`));
  L.push('');
  if (Number(d.potongan)) L.push(`Potongan: -${rp(d.potongan)}`);
  if (Number(d.ongkir)) L.push(`Ongkir: ${rp(d.ongkir)}`);
  L.push(`*TOTAL: ${rp(d.total)}*`);
  if (Number(d.nominal_bayar)) { L.push(`Dibayar: ${rp(d.nominal_bayar)}`); L.push(`*Sisa: ${rp(sisa)}*`); }
  L.push('');
  L.push(`Status: *${d.status_bayar}*`);
  if (s.rekening) { L.push(''); L.push('Pembayaran:'); L.push(s.rekening); }
  if (d.catatan) { L.push(''); L.push('_' + d.catatan + '_'); }
  L.push('');
  L.push(s.footer_invoice || 'Terima kasih 🙏');
  const ph = (d.customer_telepon || '').replace(/\D/g, '').replace(/^0/, '62');
  const url = ph
    ? `https://wa.me/${ph}?text=${encodeURIComponent(L.join('\n'))}`
    : `https://api.whatsapp.com/send?text=${encodeURIComponent(L.join('\n'))}`;
  window.open(url, '_blank');
}
async function invLunas(id) {

    toast('Invoice ditandai LUNAS ✓');
    if (INV_VIEW && INV_VIEW.id === id && document.getElementById('invPaper')) invView(id);
    else pageInvoice();
  } catch (e) { toast(e.message, 'err'); }
}

}

    </div>
    <div class="card" style="max-width:760px">
      <div class="card-head"><b>Profil Usaha</b><span class="mut">Tampil di kop invoice & pesan WhatsApp</span></div>
      <div style="padding:16px 18px">
        <div class="grid2">
          <div class="field"><label for="s_nama">Nama Usaha *</label><input id="s_nama" value="${esc(s.nama_usaha || '')}"></div>
          <div class="field"><label for="s_telp">Telepon</label><input id="s_telp" type="tel" value="${esc(s.telepon || '')}"></div>
        </div>
        <div class="field"><label for="s_alamat">Alamat</label><textarea id="s_alamat" rows="2">${esc(s.alamat || '')}</textarea></div>
        <div class="field"><label for="s_email">Email</label><input id="s_email" type="email" value="${esc(s.email || '')}"></div>
        <div class="field"><label for="s_rek">Rekening Pembayaran</label><textarea id="s_rek" rows="3" placeholder="BCA 1234567890 a.n. Nama Anda">${esc(s.rekening || '')}</textarea></div>
        <div class="grid2">
          <div class="field"><label for="s_cat">Catatan Default Invoice</label><input id="s_cat" value="${esc(s.catatan_invoice || '')}"></div>
          <div class="field"><label for="s_foot">Footer Invoice</label><input id="s_foot" value="${esc(s.footer_invoice || '')}"></div>
        </div>
        <div class="form-actions"><button class="btn" id="s_save">Simpan Pengaturan</button></div>
      </div>
    </div>`;
  /* — Preview live identitas — */
  const appDraft = () => ({
    nama_aplikasi: document.getElementById('s_appnama').value,
    inisial_aplikasi: document.getElementById('s_appini').value,
    tagline_aplikasi: document.getElementById('s_apptag').value,
  });
  const refreshPreview = () => {
    const d = appDraft(); APP_DRAFT = d;
    const nama = (d.nama_aplikasi || '').trim() || APP_DEFAULTS.nama;
    const ini = ((d.inisial_aplikasi || '').trim().slice(0, 3).toUpperCase()) || APP_DEFAULTS.inisial;
    const tag = (d.tagline_aplikasi || '').trim() || APP_DEFAULTS.tagline;
    document.getElementById('appNamePrev').textContent = nama;
    document.getElementById('appTagPrev').textContent = tag;
    document.getElementById('appLogoPrev').textContent = ini;
    setAppFromSettings(d); // sidebar + judul tab + favicon ikut berubah seketika
  };
  ['s_appnama','s_appini','s_apptag'].forEach(id => document.getElementById(id).addEventListener('input', refreshPreview));
  /* — Simpan semua — */
  $('#s_save').onclick = async () => {
    try {
      const d = appDraft();
      await api('pengaturan', { method: 'PUT', body: {
        nama_usaha: $('#s_nama').value.trim(), alamat: $('#s_alamat').value.trim(),
        telepon: $('#s_telp').value.trim(), email: $('#s_email').value.trim(),
        logo_url: LOGO_DRAFT !== null ? LOGO_DRAFT : (s.logo_url || ''),
        rekening: $('#s_rek').value.trim(),
        catatan_invoice: $('#s_cat').value.trim(), footer_invoice: $('#s_foot').value.trim(),
        nama_aplikasi: d.nama_aplikasi.trim(), inisial_aplikasi: d.inisial_aplikasi.trim(),
        tagline_aplikasi: d.tagline_aplikasi.trim() } });
      toast('Pengaturan tersimpan ✓');
    } catch (e) { toast(e.message, 'err'); }
  };
}
function logoPick(inp) {
  const f = inp.files && inp.files[0];
  if (!f) return;
  const okType = ['image/png','image/jpeg','image/webp','image/svg+xml'].includes(f.type);
  if (!okType) return toast('Format harus PNG, JPG, WebP, atau SVG', 'err');
  if (f.size > 500 * 1024) return toast('Ukuran maksimal 500 KB', 'err');
  const r = new FileReader();
  r.onload = () => {
    LOGO_DRAFT = r.result;
    const el = document.getElementById('logoPrev');
    if (el) el.innerHTML = `<img src="${LOGO_DRAFT}" alt="Preview logo baru">`;
    toast('Logo siap — klik Simpan Pengaturan');
  };
  r.readAsDataURL(f);
}
function logoDelete() {
  openModal(`<h3 id="mt">Hapus logo?</h3><p class="mut">Logo akan dihilangkan dari kop invoice. Kop akan menampilkan inisial usaha.</p>
    <div class="form-actions"><button class="btn ghost" data-close>Batal</button><button class="btn danger" id="dl">Ya, Hapus</button></div>`);
  $('#dl').onclick = async () => {
    try {
      await api('pengaturan', { method: 'PUT', body: { logo_url: '' } });
      LOGO_DRAFT = null;
      toast('Logo dihapus'); closeModal(); pagePengaturan();
    } catch (e) { toast(e.message, 'err'); }
  };
}

/* ================= PAGE: DASHBOARD ================= */
async function pageDashboard() {
  setPage('Dashboard', 'Ringkasan performa produksi, penjualan & piutang');
  const d = await api('dashboard');
  const max = Math.max(...d.chart.map(c => c.nilai), 1);
  $('#content').innerHTML = `
    <div class="stats">
      <div class="stat"><span>Net Sales — ${d.periode}</span><b class="num">${rp(d.bulan_ini.net_sales)}</b></div>
      <div class="stat"><span>Laba Bersih — ${d.periode}</span><b class="num ${d.bulan_ini.laba >= 0 ? 'up' : 'down'}">${rp(d.bulan_ini.laba)}</b><small>Margin ${pct(d.bulan_ini.margin_pct)}</small></div>
      <div class="stat"><span>HPP Terjual — ${d.periode}</span><b class="num">${rp(d.bulan_ini.hpp)}</b></div>
      <div class="stat"><span>Piutang Invoice</span><b class="num ${d.piutang_invoice > 0 ? 'down' : 'up'}">${rp(d.piutang_invoice)}</b><small>Belum dibayar pelanggan</small></div>
      <div class="stat"><span>Pembelian — ${d.periode}</span><b class="num">${rp(d.pembelian_bulan)}</b></div>
      <div class="stat hi"><span>PO Berjalan</span><b class="num">${d.counts.po_aktif}</b><small>${d.counts.produk} produk · ${d.counts.bahan} bahan</small></div>
    </div>
    <div class="card">
      <div class="card-head"><b>Penjualan 14 Hari Terakhir</b><span class="chip">Net Sales / hari</span></div>
      <div style="padding:16px 18px"><div class="chart" role="img" aria-label="Grafik penjualan 14 hari terakhir">
        ${d.chart.map((c, i) => `<div class="col" title="${fdate(c.tanggal)}: ${rp(c.nilai)}">
          <div class="bar ${i === d.chart.length - 1 ? 'acc' : ''}" style="height:${Math.max(2, c.nilai / max * 118)}px"></div>
          <span class="lbl">${c.tanggal.slice(8)}</span></div>`).join('')}
      </div></div>
    </div>
    <div class="grid2c">
      <div class="card">
        <div class="card-head"><b>HPP Terbaru</b><button class="btn ghost sm" onclick="go('hpp')">Lihat semua</button></div>
        <div class="table-wrap"><table class="mini-table">
          <thead><tr><th scope="col">PO</th><th scope="col">Produk</th><th scope="col" class="r">HPP / pcs</th><th scope="col">Status</th></tr></thead>
          <tbody>${d.hpp_terbaru.length ? d.hpp_terbaru.map(h => `<tr style="cursor:pointer" onclick="showHppBreakdown(${h.id})"><td class="mono">${esc(h.kode_po)}</td><td>${esc(h.nama_produk)}</td><td class="r bold num">${rp(h.hpp_per_pcs)}</td><td>${stBadge(h.status)}</td></tr>`).join('') : `<tr><td colspan="4">${emptyState('📊','Belum ada PO','')}</td></tr>`}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><b>Invoice Terbaru</b><button class="btn ghost sm" onclick="go('invoice')">Lihat semua</button></div>
        <div class="table-wrap"><table class="mini-table">
          <thead><tr><th scope="col">Nomor</th><th scope="col">Pelanggan</th><th scope="col" class="r">Total</th><th scope="col">Status</th></tr></thead>
          <tbody>${(d.invoice_terbaru || []).length ? d.invoice_terbaru.map(v => `<tr style="cursor:pointer" onclick="invView(${v.id})"><td class="mono">${esc(v.nomor)}</td><td>${esc(v.customer_nama)}</td><td class="r bold num">${rp(v.total)}</td><td>${payBadge(v.status_bayar)}</td></tr>`).join('') : `<tr><td colspan="4">${emptyState('🧾','Belum ada invoice','')}</td></tr>`}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><b>Penjualan Terbaru</b><button class="btn ghost sm" onclick="go('penjualan')">Lihat semua</button></div>
        <div class="table-wrap"><table class="mini-table">
          <thead><tr><th scope="col">Tanggal</th><th scope="col">Produk</th><th scope="col" class="r">Net</th><th scope="col" class="r">Laba</th></tr></thead>
          <tbody>${d.penjualan_terbaru.length ? d.penjualan_terbaru.map(j => `<tr><td>${fdate(j.tanggal)}</td><td>${esc(j.nama_produk)}<br><span class="badge b-blue" style="margin-top:2px">${esc(j.channel)}</span></td><td class="r num">${rp(j.net_sales)}</td><td class="r num ${Number(j.laba_bersih) >= 0 ? 'up' : 'down'}">${rp(j.laba_bersih)}</td></tr>`).join('') : `<tr><td colspan="4">${emptyState('🛒','Belum ada penjualan','')}</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
}

/* ================= INIT ================= */
 $('#nav').innerHTML = NAV.map(n => n.g
  ? `<div class="nav-group">${n.g}</div>`
  : `<button class="nav-item" data-id="${n.id}" onclick="go('${n.id}')">
      <svg viewBox="0 0 24 24" aria-hidden="true">${IC[n.ic]}</svg><span>${n.l}</span>
    </button>`).join('');
 $('#btnMenu').onclick = () => {
  if (window.matchMedia('(max-width:900px)').matches) {
    $('#sidebar').classList.add('open'); $('#overlay').classList.add('show');
  } else {
    document.body.classList.toggle('sb-collapsed');
  }
};
 $('#overlay').onclick = closeSidebar;
 $('#modalBack').addEventListener('click', e => { if (e.target.id === 'modalBack') closeModal(); });
 $('#modalBox').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#modalBack').classList.contains('show')) closeModal();
    closeSidebar();
  }
});
/* Muat identitas aplikasi dari database, lalu mulai */
applyBrand();
(async () => {
  try { const s = await api('pengaturan'); setAppFromSettings(s); }
  catch { applyBrand(); }
  go('dashboard');
})();
</script>
